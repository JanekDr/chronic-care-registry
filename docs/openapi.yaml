openapi: 3.0.3
info:
  title: Rejestr pacjentów z chorobą przewlekłą
  version: 1.0.0
  description: |-
    Dostęp mają aktywne konta z grupy `personel` oraz superużytkownicy. Zaloguj się przez `/accounts/login/` i zachowaj ciasteczka `sessionid` oraz `csrftoken`. Przy POST, PUT, PATCH i DELETE prześlij wartość `csrftoken` także w nagłówku `X-CSRFToken`. Wylogowanie wymaga POST na `/accounts/logout/` z tokenem CSRF.

    Listy mają po 20 rekordów na stronę. Pacjenci są sortowani według nazwiska, imienia i ID, wizyty według daty malejąco i ID rosnąco, a pozostałe zasoby według ID.
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: Pobierz opis OpenAPI w formacie JSON.
      tags:
      - schema
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Dokument OpenAPI 3.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Brak sesji, wymaganej roli lub poprawnego tokenu CSRF dla żądania
            zmieniającego dane.
  /api/v1/diagnoses/:
    get:
      operationId: diagnoses_list
      parameters:
      - name: page
        required: false
