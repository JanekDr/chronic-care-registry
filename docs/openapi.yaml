          type: string
        description: Token z ciasteczka `csrftoken` aktualnego po zalogowaniu.
        required: true
      tags:
      - diagnoses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
