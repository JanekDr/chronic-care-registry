components:
  schemas:
    Diagnosis:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
          description: Identyfikator pacjenta.
        icd10:
          type: integer
          description: Identyfikator wpisu w słowniku ICD-10.
        diagnosed_on:
          type: string
          format: date
          title: Data rozpoznania
        notes:
          type: string
          default: ''
          title: Notatka
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Utworzono
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Zmieniono
      required:
      - created_at
      - diagnosed_on
      - icd10
      - id
      - patient
      - updated_at
    DiagnosisRequest:
      type: object
      properties:
        patient:
          type: integer
          description: Identyfikator pacjenta.
        icd10:
          type: integer
          description: Identyfikator wpisu w słowniku ICD-10.
        diagnosed_on:
          type: string
          format: date
          title: Data rozpoznania
        notes:
          type: string
          default: ''
          title: Notatka
          maxLength: 1000
      required:
      - diagnosed_on
      - icd10
      - patient
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    GenderEnum:
      enum:
      - female
      - male
      - other
      type: string
      description: |-
        * `female` - Kobieta
        * `male` - Mężczyzna
        * `other` - Inna
    ICD10Code:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Kod ICD-10
        name:
          type: string
          readOnly: true
          title: Nazwa
      required:
      - code
      - id
      - name
    KindEnum:
      enum:
      - blood_glucose
      - body_weight
      type: string
      description: |-
        * `blood_glucose` - Glukoza we krwi
        * `body_weight` - Masa ciała
    Measurement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        visit:
          type: integer
          description: Identyfikator wizyty, z której wynikają pacjent i data pomiaru.
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Rodzaj
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          title: Wartość
          description: Dodatnia wartość z dokładnością do dwóch miejsc. Glukoza w
            mg/dL, masa ciała w kg.
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Utworzono
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Zmieniono
      required:
      - created_at
      - id
      - kind
      - updated_at
      - value
      - visit
    MeasurementRequest:
      type: object
      properties:
        visit:
          type: integer
          description: Identyfikator wizyty, z której wynikają pacjent i data pomiaru.
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Rodzaj
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          title: Wartość
          description: Dodatnia wartość z dokładnością do dwóch miejsc. Glukoza w
            mg/dL, masa ciała w kg.
      required:
      - kind
      - value
      - visit
    MeasurementStatistics:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        unit:
          $ref: '#/components/schemas/UnitEnum'
        count:
          type: integer
          minimum: 0
        avg:
          type: string
          nullable: true
          description: Średnia z dokładnością do dwóch miejsc po przecinku.
        min:
          type: string
          nullable: true
          description: Najmniejsza wartość z dokładnością do dwóch miejsc po przecinku.
        max:
          type: string
          nullable: true
          description: Największa wartość z dokładnością do dwóch miejsc po przecinku.
      required:
      - avg
      - count
      - kind
      - max
      - min
      - unit
    MeasurementStatisticsRequest:
